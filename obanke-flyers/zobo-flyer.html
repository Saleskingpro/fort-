<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Obanke Drinks – Fruit Zobo Flyer</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --liquid: #760E2D; --text: #701130; --tape: #370717; --wave: #522736;
    --tint: #ECBFCE; --cream: #FFFCF1; --badge: #E7C612;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; }
  .flyer {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background: linear-gradient(160deg, #FFF7F3 0%, #FBE6EA 100%);
    font-family: 'Manrope', sans-serif; color: var(--text);
  }
  /* diagonal wine band behind the bottle */
  .band {
    position: absolute; top: -200px; right: -140px; width: 640px; height: 1800px;
    background: linear-gradient(180deg, var(--liquid) 0%, var(--tape) 100%);
    transform: rotate(14deg); border-radius: 60px;
  }
  .ring { position: absolute; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .18); }
  .r1 { width: 640px; height: 640px; right: -40px; top: 300px; }
  .r2 { width: 820px; height: 820px; right: -130px; top: 210px; border-color: rgba(255, 255, 255, .1); }
  .glow { position: absolute; width: 520px; height: 520px; right: 30px; top: 380px; border-radius: 50%; background: #E0567C; filter: blur(110px); opacity: .55; }

  .bottle { position: absolute; right: 120px; bottom: 120px; height: 1100px; filter: drop-shadow(0 34px 30px rgba(40, 0, 15, .45)); }
  .floor { position: absolute; right: 110px; bottom: 105px; width: 460px; height: 44px; border-radius: 50%; background: rgba(30, 0, 10, .45); filter: blur(18px); }

  .logo { position: absolute; top: 64px; left: 72px; }
  .wordmark { position: relative; font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 52px; letter-spacing: -1px; line-height: 1; }
  .wordmark svg { position: absolute; left: 11px; top: -12px; width: 16px; }
  .drinks { display: block; font-weight: 700; font-size: 11px; letter-spacing: 8px; margin-top: 4px; padding-left: 100px; }

  .copy { position: absolute; left: 72px; top: 205px; width: 470px; }
  .eyebrow { font-weight: 800; font-size: 17px; letter-spacing: 4px; padding-bottom: 14px; border-bottom: 2.5px solid var(--text); display: inline-block; }
  h1 { font-family: 'Bricolage Grotesque'; font-weight: 800; line-height: .86; margin-top: 26px; letter-spacing: -3px; }
  h1 small { display: block; font-size: 70px; letter-spacing: -1px; }
  h1 big { display: block; font-size: 190px; }
  .tag { font-family: 'Bricolage Grotesque'; font-weight: 700; font-size: 34px; margin-top: 18px; color: #A0375A; }

  .ing-title { margin-top: 40px; display: inline-block; background: var(--text); color: var(--cream); font-weight: 800; font-size: 16px; letter-spacing: 3px; padding: 10px 22px; border-radius: 99px; }
  ul { list-style: none; margin-top: 18px; }
  li { font-size: 25px; font-weight: 600; padding: 10px 0 10px 34px; position: relative; border-bottom: 1.5px solid rgba(112, 17, 48, .14); width: 360px; }
  li::before { content: ''; position: absolute; left: 4px; top: 50%; width: 13px; height: 13px; margin-top: -6px; border-radius: 50%; background: var(--liquid); box-shadow: 0 0 0 4px var(--tint); }

  .perks { position: absolute; left: 72px; top: 985px; display: flex; gap: 12px; }
  .perks span { background: #fff; border: 2px solid var(--tint); border-radius: 99px; padding: 10px 18px; font-weight: 800; font-size: 17px; }

  .badge {
    position: absolute; top: 250px; right: 70px; width: 150px; height: 150px; border-radius: 50%;
    background: var(--badge); color: var(--tape); transform: rotate(-10deg); border: 5px solid #fff8d0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Bricolage Grotesque'; font-weight: 800; box-shadow: 0 12px 26px rgba(0, 0, 0, .3); z-index: 3;
  }
  .badge b { font-size: 46px; line-height: .9; }
  .badge small { font-size: 19px; letter-spacing: 1px; }

  .cta { position: absolute; left: 72px; bottom: 56px; display: flex; align-items: center; gap: 16px; background: #fff; border-radius: 99px; padding: 14px 34px 14px 16px; box-shadow: 0 14px 30px rgba(112, 17, 48, .25); z-index: 3; }
  .cta svg { width: 54px; height: 54px; }
  .cta .lbl { font-size: 15px; font-weight: 800; letter-spacing: 2px; color: #A0375A; }
  .cta .num { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 44px; line-height: 1; }
  .sizes { position: absolute; right: 72px; bottom: 66px; color: var(--cream); font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 30px; z-index: 3; text-align: right; line-height: 1.1; }
  .sizes small { display: block; font-family: 'Manrope'; font-size: 14px; letter-spacing: 3px; opacity: .8; }
</style>
</head>
<body>
<div class="flyer">
  <div class="band"></div>
  <div class="ring r2"></div><div class="ring r1"></div>
  <div class="glow"></div>
  <div class="floor"></div>
  <img class="bottle" src="assets/zobo.png">

  <div class="badge"><b>100%</b><small>NATURAL</small></div>

  <div class="logo">
    <div class="wordmark"><svg viewBox="0 0 20 28"><path d="M3 26C3 12 9 4 18 1c1 10-4 20-15 25z" fill="currentColor"/></svg>obanke</div>
    <span class="drinks">DRINKS</span>
  </div>

  <div class="copy">
    <div class="eyebrow">FRESH FRUIT DRINK</div>
    <h1><small>Fruit</small><big>Zobo</big></h1>
    <div class="tag">Tangy, spiced &amp; refreshing.</div>

    <div class="ing-title">INGREDIENTS</div>
    <ul>
      <li>Hibiscus Flower</li>
      <li>Pineapple</li>
      <li>Ginger</li>
      <li>Clove</li>
      <li>Date</li>
    </ul>
  </div>

  <div class="perks"><span>Rich in antioxidants</span><span>Best served chilled</span></div>

  <div class="cta">
    <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#25D366"/><path fill="#fff" d="M24 10.5c-7.4 0-13.4 6-13.4 13.4 0 2.4.6 4.6 1.8 6.6L10.5 37.5l7.2-1.9c1.9 1 4.1 1.6 6.3 1.6 7.4 0 13.4-6 13.4-13.4S31.4 10.5 24 10.5zm0 24.4c-2 0-4-.5-5.7-1.6l-.4-.2-4.3 1.1 1.1-4.2-.3-.4a11 11 0 1 1 9.6 5.3zm6-8.2c-.3-.2-2-1-2.3-1.1-.3-.1-.5-.2-.8.2l-1 1.3c-.2.2-.4.3-.7.1-.3-.2-1.4-.5-2.7-1.7-1-.9-1.7-2-1.9-2.3-.2-.3 0-.5.1-.7l.5-.6.4-.6c.1-.2 0-.4 0-.6l-1.1-2.6c-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9s1.2 3.4 1.4 3.6c.2.2 2.4 3.7 5.9 5.2 2.9 1.1 3.5.9 4.1.8.6-.1 2-.8 2.3-1.6.3-.8.3-1.5.2-1.6-.1-.2-.3-.3-.6-.4z"/></svg>
    <div><div class="lbl">ORDER ON WHATSAPP</div><div class="num">0813 212 5306</div></div>
  </div>
  <div class="sizes"><small>AVAILABLE IN</small>25CL · 50CL</div>
</div>
</body>
</html>
