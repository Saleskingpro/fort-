<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Obanke Drinks – Group Flyer</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFFCF1; --beige: #E3D8B9; --brown: #593819; --wine: #701130;
    --badge: #E7C612; --leaf: #4E8B2B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; }
  .flyer {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background: radial-gradient(120% 70% at 50% 0%, var(--cream) 0%, #F6EED8 55%, var(--beige) 100%);
    font-family: 'Manrope', sans-serif; color: var(--brown);
  }
  /* soft colour glows echoing the drink families */
  .glow { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; }
  .g1 { width: 420px; height: 420px; background: #F8A64A; left: -120px; top: 520px; }
  .g2 { width: 420px; height: 420px; background: #C9415F; right: -130px; top: 560px; }
  .g3 { width: 520px; height: 300px; background: #F1E3BB; left: 280px; top: 560px; opacity: .8; }

  .logo { position: absolute; top: 58px; left: 0; right: 0; text-align: center; color: var(--wine); }
  .wordmark { position: relative; display: inline-block; font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 64px; letter-spacing: -1px; line-height: 1; }
  .wordmark svg { position: absolute; left: 14px; top: -14px; width: 20px; }
  .drinks { display: block; font-weight: 700; font-size: 13px; letter-spacing: 9px; margin-top: 6px; padding-left: 120px; }

  .headline { position: absolute; top: 205px; left: 0; right: 0; text-align: center; }
  .headline h1 { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 118px; line-height: .92; letter-spacing: -3px; color: var(--brown); }
  .headline h1 span { color: var(--wine); }
  .headline p { margin-top: 22px; font-size: 27px; font-weight: 600; color: #6F5134; }

  .bottles { position: absolute; left: 0; right: 0; top: 520px; height: 560px; }
  .bottles img { position: absolute; bottom: 0; filter: drop-shadow(0 22px 22px rgba(70, 40, 10, .28)); }

  .ground { position: absolute; left: 90px; right: 90px; top: 1060px; height: 40px; border-radius: 50%; background: rgba(89, 56, 25, .22); filter: blur(16px); }

  .badge {
    position: absolute; top: 470px; right: 70px; width: 150px; height: 150px; border-radius: 50%;
    background: var(--badge); color: var(--brown); transform: rotate(12deg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Bricolage Grotesque'; font-weight: 800; box-shadow: 0 10px 24px rgba(120, 90, 0, .3);
    border: 5px solid #fff8d0;
  }
  .badge b { font-size: 34px; line-height: .95; }
  .badge small { font-family: 'Manrope'; font-size: 13px; font-weight: 800; letter-spacing: 2px; margin-bottom: 2px; }

  .flavours { position: absolute; top: 1098px; left: 60px; right: 60px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .flavours span { font-size: 17px; font-weight: 700; padding: 7px 16px; border-radius: 99px; background: rgba(255, 255, 255, .7); border: 1.5px solid rgba(89, 56, 25, .15); }
  .flavours i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 8px; vertical-align: 0; }

  .cta { position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; align-items: center; gap: 22px; }
  .pill { display: flex; align-items: center; gap: 16px; background: #fff; border-radius: 99px; padding: 16px 36px 16px 18px; box-shadow: 0 12px 30px rgba(89, 56, 25, .22); }
  .pill .wa { width: 52px; height: 52px; }
  .pill .lbl { font-size: 15px; font-weight: 800; letter-spacing: 2px; color: #8B6A4A; text-transform: uppercase; }
  .pill .num { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 44px; color: var(--wine); line-height: 1; }
  .sizes { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 24px; color: var(--cream); background: var(--brown); border-radius: 22px; padding: 14px 22px; text-align: center; line-height: 1.05; }
  .sizes small { display: block; font-family: 'Manrope'; font-size: 13px; font-weight: 700; letter-spacing: 2px; opacity: .8; }
</style>
</head>
<body>
<div class="flyer">
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>

  <div class="logo">
    <div class="wordmark">
      <svg viewBox="0 0 20 28"><path d="M3 26C3 12 9 4 18 1c1 10-4 20-15 25z" fill="currentColor"/></svg>obanke
    </div>
    <span class="drinks">DRINKS</span>
  </div>

  <div class="headline">
    <h1>7 Drinks.<br><span>100% Natural.</span></h1>
    <p>Fresh juices, tigernut &amp; fruit drinks, made to refresh.</p>
  </div>

  <div class="badge"><small>2 SIZES</small><b>25CL</b><b>50CL</b></div>

  <div class="ground"></div>
  <div class="bottles">
    <img src="assets/c_orange.png"           style="height:420px; left:38px;  z-index:1">
    <img src="assets/c_pineapple_ginger.png" style="height:460px; left:165px; z-index:2">
    <img src="assets/c_pineapple.png"        style="height:500px; left:300px; z-index:3">
    <img src="assets/c_tigernut_milky.png"   style="height:545px; left:445px; z-index:5">
    <img src="assets/c_tigernut_pure.png"    style="height:500px; left:598px; z-index:3">
    <img src="assets/c_beetroot.png"         style="height:460px; left:745px; z-index:2">
    <img src="assets/c_zobo.png"             style="height:420px; left:880px; z-index:1">
  </div>

  <div class="flavours">
    <span><i style="background:#F38A1E"></i>Orange</span>
    <span><i style="background:#DFA538"></i>Pineapple Ginger</span>
    <span><i style="background:#ECCE45"></i>Pineapple</span>
    <span><i style="background:#D7C7A9"></i>Tigernut Milky</span>
    <span><i style="background:#DCCBA1"></i>Tigernut Pure Milky</span>
    <span><i style="background:#AC163D"></i>Beetroot &amp; Watermelon</span>
    <span><i style="background:#760E2D"></i>Fruit Zobo</span>
  </div>

  <div class="cta">
    <div class="pill">
      <svg class="wa" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#25D366"/><path fill="#fff" d="M24 10.5c-7.4 0-13.4 6-13.4 13.4 0 2.4.6 4.6 1.8 6.6L10.5 37.5l7.2-1.9c1.9 1 4.1 1.6 6.3 1.6 7.4 0 13.4-6 13.4-13.4S31.4 10.5 24 10.5zm0 24.4c-2 0-4-.5-5.7-1.6l-.4-.2-4.3 1.1 1.1-4.2-.3-.4a11 11 0 1 1 9.6 5.3zm6-8.2c-.3-.2-2-1-2.3-1.1-.3-.1-.5-.2-.8.2l-1 1.3c-.2.2-.4.3-.7.1-.3-.2-1.4-.5-2.7-1.7-1-.9-1.7-2-1.9-2.3-.2-.3 0-.5.1-.7l.5-.6.4-.6c.1-.2 0-.4 0-.6l-1.1-2.6c-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9s1.2 3.4 1.4 3.6c.2.2 2.4 3.7 5.9 5.2 2.9 1.1 3.5.9 4.1.8.6-.1 2-.8 2.3-1.6.3-.8.3-1.5.2-1.6-.1-.2-.3-.3-.6-.4z"/></svg>
      <div><div class="lbl">Order on WhatsApp</div><div class="num">0813 212 5306</div></div>
    </div>
  </div>
</div>
</body>
</html>
